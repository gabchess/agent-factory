name: crash-lab-method

on:
  pull_request:
    paths: ["skills/quality/crash-lab-method/**", ".github/workflows/crash-lab-method.yml"]
  push:
    branches: [main]
    paths: ["skills/quality/crash-lab-method/**", ".github/workflows/crash-lab-method.yml"]

permissions:
  contents: read

jobs:
  script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [18, 22]
    defaults:
      run:
        working-directory: skills/quality/crash-lab-method
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/crashlab.test.mjs
      - name: Script stays under the Agensi 20 KB guideline
        run: test "$(wc -c < scripts/crashlab.mjs)" -lt 20000
