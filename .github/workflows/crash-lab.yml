name: crash-lab

on:
  pull_request:
    paths: ["skills/quality/crash-lab/**", ".github/workflows/crash-lab.yml"]
  push:
    branches: [main]
    paths: ["skills/quality/crash-lab/**", ".github/workflows/crash-lab.yml"]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skills/quality/crash-lab/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: skills/quality/crash-lab/scripts/.nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run lint:comments
      - run: npm run typecheck
      - run: npm test
      - run: node src/cli/main.ts audit
      - run: node src/cli/main.ts fixtures
      - run: node src/cli/main.ts fixtures --case excuse-contagion
